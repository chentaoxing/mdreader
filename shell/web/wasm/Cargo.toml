[package]
name = "mdcore-wasm"
version = "0.2.0"
edition = "2021"
description = "MD文档阅读助手核心的 WASM 门面：只吃字节、只吐 JSON 信封，UI 判定一行不在这里"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
mdcore = { path = "../../../crates/mdcore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory"]
